events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server app01-clientes:5001;
        server app02-productos:6001;
        server app03-proveedores:7001;
    }

    server {
        listen 80;
        server_name localhost;

        # Configurar el puerto del proxy para los redirects
        proxy_redirect http://localhost/ http://localhost:7000/;
        proxy_redirect http://app01-clientes:5001/ http://localhost:7000/;
        proxy_redirect http://app02-productos:6001/ http://localhost:7000/;
        proxy_redirect http://app03-proveedores:7001/ http://localhost:7000/;
        proxy_redirect / http://localhost:7000/;

        # Ruta raíz - Round-robin entre las 3 apps
        location = / {
            proxy_pass http://backend;
            proxy_set_header Host localhost:7000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host localhost:7000;
            proxy_set_header X-Forwarded-Port 7000;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Clientes - siempre va a app01
        location /clientes {
            proxy_pass http://app01-clientes:5001;
            proxy_set_header Host localhost:7000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host localhost:7000;
        }

        # Productos - siempre va a app02
        location /productos {
            proxy_pass http://app02-productos:6001;
            proxy_set_header Host localhost:7000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host localhost:7000;
        }

        # Proveedores - siempre va a app03
        location /proveedores {
            proxy_pass http://app03-proveedores:7001;
            proxy_set_header Host localhost:7000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host localhost:7000;
        }

        # Archivos estáticos de clientes
        location /clientes/css/ {
            proxy_pass http://app01-clientes:5001/css/;
            proxy_set_header Host $host;
        }

        # Archivos estáticos de productos
        location /productos/css/ {
            proxy_pass http://app02-productos:6001/css/;
            proxy_set_header Host $host;
        }

        # Archivos estáticos de proveedores
        location /proveedores/css/ {
            proxy_pass http://app03-proveedores:7001/css/;
            proxy_set_header Host $host;
        }

        # Archivos estáticos generales (para ruta raíz)
        location /css/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }
}
