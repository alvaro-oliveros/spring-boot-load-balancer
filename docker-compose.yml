services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: microservices_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d microservices_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # App01 - Clientes (Java Spring Boot)
  app01-clientes:
    build: ./app01
    container_name: app01-clientes
    ports:
      - "5001:5001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SERVER_PORT: 5001
    depends_on:
      postgres:
        condition: service_healthy

  # App02 - Productos (Java Spring Boot)
  app02-productos:
    build: ./app02
    container_name: app02-productos
    ports:
      - "6001:6001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SERVER_PORT: 6001
    depends_on:
      postgres:
        condition: service_healthy

  # App03 - Proveedores (Java Spring Boot)
  app03-proveedores:
    build: ./app03
    container_name: app03-proveedores
    ports:
      - "7001:7001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SERVER_PORT: 7001
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx Load Balancer
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "7000:80"
    volumes:
      - ./nginx-loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app01-clientes
      - app02-productos
      - app03-proveedores
    restart: unless-stopped

volumes:
  postgres_data:
