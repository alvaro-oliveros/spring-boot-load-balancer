<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Producto</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <header>
            <a href="/" class="btn-inicio">Inicio</a>
            <h1 th:text="${producto.id != null} ? 'Editar Producto' : 'Nuevo Producto'">Formulario Producto</h1>
            <p class="subtitle">Microservicio App02 - Spring Boot</p>
        </header>

        <div class="form-container">
            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required>
                </div>

                <div class="form-group">
                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" th:field="*{precio}" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <input type="text" id="categoria" th:field="*{categoria}" required>
                </div>

                <div class="form-group">
                    <label for="stock">Stock:</label>
                    <input type="number" id="stock" th:field="*{stock}" min="0" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>

        <footer>
            <p>Ejecutándose en puerto: <strong th:text="${puerto}">6001</strong></p>
            <p class="tech">Java Spring Boot + PostgreSQL + Nginx Load Balancer</p>
        </footer>
    </div>
</body>
</html>
